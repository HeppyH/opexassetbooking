name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Application tests
        run: npm test

      - name: Web regression tests
        run: npm --workspace apps/web run test

      - name: Service Add-In tests
        run: node --experimental-strip-types apps/web/test/service-addin.test.mjs

      - name: Production build
        run: npm --workspace apps/web run build
